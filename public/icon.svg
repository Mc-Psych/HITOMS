<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- Hospital Cross + Network Server Node graphic -->
  <g transform="translate(256,230)">
    <!-- Tech Cross Base -->
    <rect x="-35" y="-120" width="70" height="240" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-120" y="-35" width="240" height="70" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Center Tech Chip -->
    <circle cx="0" cy="0" r="32" fill="#0284c7" />
    <circle cx="0" cy="0" r="16" fill="#38bdf8" />
    <!-- Network nodes -->
    <circle cx="-160" cy="-60" r="14" fill="#38bdf8" />
    <line x1="-160" y1="-60" x2="-100" y2="-20" stroke="#38bdf8" stroke-width="6" stroke-dasharray="6,4" />
    <circle cx="160" cy="-60" r="14" fill="#38bdf8" />
    <line x1="160" y1="-60" x2="100" y2="-20" stroke="#38bdf8" stroke-width="6" stroke-dasharray="6,4" />
    <circle cx="-150" cy="80" r="12" fill="#38bdf8" />
    <line x1="-150" y1="80" x2="-90" y2="40" stroke="#38bdf8" stroke-width="6" stroke-dasharray="6,4" />
    <circle cx="150" cy="80" r="12" fill="#38bdf8" />
    <line x1="150" y1="80" x2="90" y2="40" stroke="#38bdf8" stroke-width="6" stroke-dasharray="6,4" />
  </g>
  <!-- Text Label -->
  <text x="256" y="420" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="4">HITOMS</text>
  <text x="256" y="456" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" letter-spacing="1">HOSPITAL IT OPERATIONS</text>
</svg>
